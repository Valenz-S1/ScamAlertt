version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: scamalert_db
    restart: always
    environment:
      POSTGRES_USER: scamalert
      POSTGRES_PASSWORD: scamalert123
      POSTGRES_DB: scamalert_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
